[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
unmaintained = "workspace"
yanked = "deny"

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8

[licenses.private]
ignore = false

# Verified BSD 2-Clause notices in usls vision/image transitive dependencies.
[[licenses.exceptions]]
name = "av1-grain"
allow = ["BSD-2-Clause"]

[[licenses.exceptions]]
name = "rav1e"
allow = ["BSD-2-Clause"]

[[licenses.exceptions]]
name = "v_frame"
allow = ["BSD-2-Clause"]
