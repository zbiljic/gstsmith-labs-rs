[package]
name = "gst-plugin-diarization"
version = { workspace = true }
description = "GStreamer speaker diarization for transcription cues."
authors = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
license = { workspace = true }
readme = "README.md"
repository = { workspace = true }

[package.metadata.capi]
min_version = "0.9.21"

[package.metadata.capi.header]
enabled = false

[package.metadata.capi.library]
install_subdir = "gstreamer-1.0"
versioning = false
import_library = false

[package.metadata.capi.pkg_config]
requires_private = "gstreamer-1.0 >= 1.28, gstreamer-analytics-1.0 >= 1.28, gobject-2.0, glib-2.0, gmodule-2.0"

[dependencies]
analytics-meta = { path = "../../utils/analytics-meta" }
gst = { workspace = true, features = ["v1_28"] }
gst-analytics = { workspace = true }
ort = { workspace = true, features = ["download-binaries", "tls-rustls", "copy-dylibs"] }
serde = { workspace = true }
sha2 = { workspace = true }
toml = { workspace = true }

[features]
default = []
static = []
capi = []
doc = []

[dev-dependencies]
anyhow = { workspace = true }
gst-app = { workspace = true }
gst-check = { workspace = true }

[lib]
name = "gstdiarization"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[lints]
workspace = true

[build-dependencies]
gst-plugin-version-helper = { workspace = true }
