[package]
name = "gst-plugin-diarization"
version = { workspace = true }
description = "GStreamer speaker diarization for transcription cues."
authors = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
license = { workspace = true }
readme = "README.md"
repository = { workspace = true }

[package.metadata.capi]
min_version = "0.9.21"

[package.metadata.capi.header]
enabled = false

[package.metadata.capi.library]
install_subdir = "gstreamer-1.0"
versioning = false
import_library = false

[package.metadata.capi.pkg_config]
requires_private = "gstreamer-1.0 >= 1.24, gobject-2.0, glib-2.0, gmodule-2.0"

[dependencies]
gst = { workspace = true }
ort = { workspace = true, features = ["download-binaries", "tls-rustls", "copy-dylibs"] }
sha2 = { workspace = true }

[features]
default = []
static = []
capi = []
doc = []

[lib]
name = "gstdiarization"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[build-dependencies]
gst-plugin-version-helper = { workspace = true }

[lints]
workspace = true
