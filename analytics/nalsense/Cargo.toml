[package]
name = "gst-plugin-nalsense"
version = { workspace = true }
description = "Portable encoded-video activity analysis plugin for GStreamer."
authors = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
license = { workspace = true }
readme = "README.md"
repository = { workspace = true }

[package.metadata.capi]
min_version = "0.9.21"

[package.metadata.capi.header]
enabled = false

[package.metadata.capi.library]
install_subdir = "gstreamer-1.0"
versioning = false
import_library = false

[package.metadata.capi.pkg_config]
requires_private = "gstreamer-1.0 >= 1.24, gstreamer-base-1.0 >= 1.24, gobject-2.0, glib-2.0, gmodule-2.0"

[dependencies]
gst = { workspace = true }
gst-base = { workspace = true }
h264-reader = { workspace = true, optional = true }

[features]
static = []
capi = []
doc = ["gst/v1_24", "gst-base/v1_24"]
qp-diagnostics = ["dep:h264-reader"]

[lib]
name = "gstnalsense"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[build-dependencies]
gst-plugin-version-helper = { workspace = true }

[[bench]]
name = "hot_path"
harness = false

[lints]
workspace = true

[dev-dependencies]
criterion = { workspace = true }
gst-check = { workspace = true }
