[package]
name = "gst-plugin-relationmeta"
version = { workspace = true }
description = "GStreamer elements that turn analytics relation metadata into events and overlays."
authors = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
license = { workspace = true }
readme = "README.md"
repository = { workspace = true }

[package.metadata.capi]
min_version = "0.9.21"

[package.metadata.capi.header]
enabled = false

[package.metadata.capi.library]
install_subdir = "gstreamer-1.0"
versioning = false
import_library = false

[package.metadata.capi.pkg_config]
requires_private = "gstreamer-1.0 >= 1.28, gstreamer-base-1.0 >= 1.28, gstreamer-video-1.0 >= 1.28, gstreamer-analytics-1.0 >= 1.28, pangocairo, gobject-2.0, glib-2.0, gmodule-2.0"

[dependencies]
analytics-meta = { path = "../../utils/analytics-meta" }
cairo-rs = { workspace = true }
gst = { workspace = true, features = ["v1_28"] }
gst-analytics = { workspace = true }
gst-base = { workspace = true, features = ["v1_28"] }
gst-video = { workspace = true, features = ["v1_28"] }
pango = { workspace = true }
pangocairo = { workspace = true }

[features]
static = []
capi = []
doc = []

[lib]
name = "gstrelationmeta"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dev-dependencies]
anyhow = { workspace = true }
gst-app = { workspace = true }
gst-check = { workspace = true }

[lints]
workspace = true

[build-dependencies]
gst-plugin-version-helper = { workspace = true }
