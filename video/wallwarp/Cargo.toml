[package]
name = "gst-plugin-wallwarp"
version = { workspace = true }
description = "GStreamer perspective warp mapping a source quadrilateral onto one video wall display."
authors = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
license = { workspace = true }
readme = "README.md"
repository = { workspace = true }

[package.metadata.capi]
min_version = "0.9.21"

[package.metadata.capi.header]
enabled = false

[package.metadata.capi.library]
install_subdir = "gstreamer-1.0"
versioning = false
import_library = false

[package.metadata.capi.pkg_config]
requires_private = "gstreamer-1.0 >= 1.24, gstreamer-base-1.0 >= 1.24, gstreamer-video-1.0 >= 1.24, gobject-2.0, glib-2.0, gmodule-2.0"

[dependencies]
gst = { workspace = true }
gst-base = { workspace = true }
gst-video = { workspace = true }
wall-geometry = { path = "../../utils/wall-geometry" }

[features]
static = []
capi = []
doc = ["gst/v1_24", "gst-base/v1_24", "gst-video/v1_24"]

[lib]
name = "gstwallwarp"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dev-dependencies]
criterion = { workspace = true }
gst-check = { workspace = true }

[[bench]]
name = "hot_path"
harness = false

[lints]
workspace = true

[build-dependencies]
gst-plugin-version-helper = { workspace = true }
