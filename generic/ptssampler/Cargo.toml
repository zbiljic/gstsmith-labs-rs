[package]
name = "gst-plugin-ptssampler"
version = { workspace = true }
description = "GStreamer sampler keeping the first buffer of every running-time period."
authors = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
license = { workspace = true }
readme = "README.md"
repository = { workspace = true }

[package.metadata.capi]
min_version = "0.9.21"

[package.metadata.capi.header]
enabled = false

[package.metadata.capi.library]
install_subdir = "gstreamer-1.0"
versioning = false
import_library = false

[package.metadata.capi.pkg_config]
requires_private = "gstreamer-1.0 >= 1.24, gstreamer-base-1.0 >= 1.24, gobject-2.0, glib-2.0, gmodule-2.0"

[dependencies]
atomic_refcell = { workspace = true }
gst = { workspace = true }
gst-base = { workspace = true }

[features]
static = []
capi = []
doc = ["gst/v1_24"]

[lib]
name = "gstptssampler"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dev-dependencies]
criterion = { workspace = true }
gst-check = { workspace = true }

[[bench]]
name = "hot_path"
harness = false

[lints]
workspace = true

[build-dependencies]
gst-plugin-version-helper = { workspace = true }
