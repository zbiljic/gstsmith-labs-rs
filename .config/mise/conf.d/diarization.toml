[tasks."diarization:models"]
description = "Download the pinned speaker model to target/models"
run = '''
set -eu
digest() { if command -v sha256sum >/dev/null; then sha256sum "$1"; else shasum -a 256 "$1"; fi | cut -d' ' -f1; }
fetch() {
  dest="$1" url="$2" expected="$3"
  if [ -f "$dest" ] && [ "$(digest "$dest")" = "$expected" ]; then echo "$dest"; return; fi
  mkdir -p "$(dirname "$dest")"
  partial="$dest.partial.$$"
  curl --fail --location --silent --show-error --retry 3 --output "$partial" "$url" || { rm -f "$partial"; exit 1; }
  actual="$(digest "$partial")"
  if [ "$actual" != "$expected" ]; then rm -f "$partial"; echo "$url has SHA-256 $actual, expected $expected" >&2; exit 1; fi
  mv "$partial" "$dest"
  echo "$dest"
}
# WeSpeaker ResNet34-LM (CC-BY-4.0, WeSpeaker).
fetch "${DIARIZATION_WESPEAKER_MODEL:-target/models/wespeaker-resnet34.onnx}" \
  https://huggingface.co/Wespeaker/wespeaker-voxceleb-resnet34-LM/resolve/f0c48c298fd835726c27956a5d617bad7115627e/voxceleb_resnet34_LM.onnx \
  7bb2f06e9df17cdf1ef14ee8a15ab08ed28e8d0ef5054ee135741560df2ec068
'''

[tasks."diarization:samples"]
description = "Download the pinned labelled conversations the diarizer tests use to target/models"
run = '''
set -eu
digest() { if command -v sha256sum >/dev/null; then sha256sum "$1"; else shasum -a 256 "$1"; fi | cut -d' ' -f1; }
fetch() {
  dest="$1" url="$2" expected="$3"
  if [ -f "$dest" ] && [ "$(digest "$dest")" = "$expected" ]; then echo "$dest"; return; fi
  mkdir -p "$(dirname "$dest")"
  partial="$dest.partial.$$"
  curl --fail --location --silent --show-error --retry 3 --output "$partial" "$url" || { rm -f "$partial"; exit 1; }
  actual="$(digest "$partial")"
  if [ "$actual" != "$expected" ]; then rm -f "$partial"; echo "$url has SHA-256 $actual, expected $expected" >&2; exit 1; fi
  mv "$partial" "$dest"
  echo "$dest"
}
dir="${DIARIZATION_SAMPLES:-target/models/diarization-samples}"
# pyannote.audio test and tutorial audio with speaker turns (MIT, CNRS):
# a two-speaker sample, and two AMI meeting excerpts (CC-BY-4.0).
base=https://raw.githubusercontent.com/pyannote/pyannote-audio/1a22b0236c52fd3e20d41315e7b340cf5c623a52
fetch "$dir/sample.wav" "$base/tutorials/assets/sample.wav" \
  c319b4abca767b124e41432d364fd7df006cb26bb79d09326c487d606a134e6e
fetch "$dir/sample.rttm" "$base/tutorials/assets/sample.rttm" \
  d78fe62c69d8e6dcbb42c26adfce83faccb374c5a1e6d987fe37f85f1c173c87
fetch "$dir/dev00.wav" "$base/tests/data/dev00.wav" \
  187386cda67317574da5b30068a8b853e52cc6df0d13abfec381912dfa9e7461
fetch "$dir/dev01.wav" "$base/tests/data/dev01.wav" \
  13834217e1bd46a581af1b8040018bfba1e65ce1e0b9ee46cdcefa9334b9ddea
fetch "$dir/debug.development.rttm" "$base/tests/data/debug.development.rttm" \
  9667a672072f7d0ad5b647cfaed987d8c52209a4e1ddc252fed06d0b955e7aeb
'''
