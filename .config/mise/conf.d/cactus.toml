[tasks."cactus:weights"]
description = "Download the pinned Mirage and Whistle weights to target/models"
run = '''
set -eu
digest() { if command -v sha256sum >/dev/null; then sha256sum "$1"; else shasum -a 256 "$1"; fi | cut -d' ' -f1; }
fetch() {
  dest="$1" url="$2" expected="$3"
  if [ -f "$dest" ] && [ "$(digest "$dest")" = "$expected" ]; then echo "$dest"; return; fi
  mkdir -p "$(dirname "$dest")"
  curl --fail --location --silent --show-error --retry 3 --output "$dest.partial" "$url"
  actual="$(digest "$dest.partial")"
  if [ "$actual" != "$expected" ]; then rm -f "$dest.partial"; echo "$url has SHA-256 $actual, expected $expected" >&2; exit 1; fi
  mv "$dest.partial" "$dest"
  echo "$dest"
}
fetch "${CACTUS_MIRAGE_WEIGHTS:-target/models/mirage.cact}" \
  https://huggingface.co/Cactus-Compute/mirage/resolve/76c1e9e53381aca8fc3843c636216c96ff220122/mirage.cact \
  4249a0f7515272ff76b9414bec17d7e7daf84b15b66c7fb4f17fce1e66f9f237
fetch "${CACTUS_WHISTLE_WEIGHTS:-target/models/whistle.cact}" \
  https://huggingface.co/Cactus-Compute/whistle/resolve/741118687e1f008f06d1351a402a731274789790/whistle.cact \
  b6e02f048568ac5d01a2042556c658061e699acbc0aa2a1439f52f3d461dffeb
# The public-domain Apollo 13 "Houston, we've had a problem" exchange, 30 s.
fetch "${CACTUS_SPEECH_SAMPLE:-target/models/a13.wav}" \
  https://huggingface.co/datasets/Narsil/candle-examples/resolve/5d1e6b2165c9c338dba3b709cf716cada079565e/samples_a13.wav \
  52cc7544fc5747bc988a18e26b1f8286ead819e037c6cd230a9589dcaaf90186
'''

[tasks."cactus:smoke"]
description = "Run the opt-in engine API tests (cactus crate) with the real engine"
depends = ["cactus:weights"]
run = '''
export CACTUS_MIRAGE_WEIGHTS="$(realpath "${CACTUS_MIRAGE_WEIGHTS:-target/models/mirage.cact}")"
export CACTUS_WHISTLE_WEIGHTS="$(realpath "${CACTUS_WHISTLE_WEIGHTS:-target/models/whistle.cact}")"
export CACTUS_SPEECH_SAMPLE="$(realpath "${CACTUS_SPEECH_SAMPLE:-target/models/a13.wav}")"
cargo test --release --locked -p cactus --test engine --test speech -- --ignored --nocapture --test-threads=1
'''

[tasks."cactus:deps:check"]
description = "Check that only the cactus plugin links the Cactus engine"
run = "ci/check-cactus-links.sh"
